openapi: 3.0.3
info:
  title: Techorbit Interview Service
  version: 0.1.0
  description: Interview scheduling (SCHEDULED → IN_PROGRESS → COMPLETED | NO_SHOW
    | CANCELLED), Daily.co video room management (mock mode when DAILY_API_KEY
    is unset), post-interview scorecards, and transactional outbox events.
servers:
  - url: http://localhost:3007
    description: Local dev
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                nullable: true
          required:
            - code
            - message
      required:
        - error
    ScheduleInterviewRequest:
      type: object
      properties:
        requirementId:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        interviewerUserId:
          type: string
          format: uuid
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
      required:
        - requirementId
        - submissionId
        - candidateId
        - scheduledStart
        - scheduledEnd
    InterviewResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requirementId:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        scheduledByUserId:
          type: string
          format: uuid
        interviewerUserId:
          type: string
          nullable: true
          format: uuid
        conductedByRole:
          type: string
          enum:
            - PLATFORM_INTERVIEWER
            - CUSTOMER_INTERNAL
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        videoRoomUrl:
          type: string
          nullable: true
        videoRecordingUrl:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - SCHEDULED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
            - NO_SHOW
        startedAt:
          type: string
          nullable: true
          format: date-time
        endedAt:
          type: string
          nullable: true
          format: date-time
        cancelledAt:
          type: string
          nullable: true
          format: date-time
        cancelledBy:
          type: string
          nullable: true
          format: uuid
        cancelReason:
          type: string
          nullable: true
        interviewerFeeUsd:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - requirementId
        - submissionId
        - candidateId
        - scheduledByUserId
        - interviewerUserId
        - conductedByRole
        - scheduledStart
        - scheduledEnd
        - videoRoomUrl
        - videoRecordingUrl
        - status
        - startedAt
        - endedAt
        - cancelledAt
        - cancelledBy
        - cancelReason
        - interviewerFeeUsd
        - createdAt
        - updatedAt
    InterviewListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              requirementId:
                type: string
                format: uuid
              submissionId:
                type: string
                format: uuid
              candidateId:
                type: string
                format: uuid
              scheduledByUserId:
                type: string
                format: uuid
              interviewerUserId:
                type: string
                nullable: true
                format: uuid
              conductedByRole:
                type: string
                enum:
                  - PLATFORM_INTERVIEWER
                  - CUSTOMER_INTERNAL
              scheduledStart:
                type: string
                format: date-time
              scheduledEnd:
                type: string
                format: date-time
              videoRoomUrl:
                type: string
                nullable: true
              videoRecordingUrl:
                type: string
                nullable: true
              status:
                type: string
                enum:
                  - SCHEDULED
                  - IN_PROGRESS
                  - COMPLETED
                  - CANCELLED
                  - NO_SHOW
              startedAt:
                type: string
                nullable: true
                format: date-time
              endedAt:
                type: string
                nullable: true
                format: date-time
              cancelledAt:
                type: string
                nullable: true
                format: date-time
              cancelledBy:
                type: string
                nullable: true
                format: uuid
              cancelReason:
                type: string
                nullable: true
              interviewerFeeUsd:
                type: number
                nullable: true
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
            required:
              - id
              - requirementId
              - submissionId
              - candidateId
              - scheduledByUserId
              - interviewerUserId
              - conductedByRole
              - scheduledStart
              - scheduledEnd
              - videoRoomUrl
              - videoRecordingUrl
              - status
              - startedAt
              - endedAt
              - cancelledAt
              - cancelledBy
              - cancelReason
              - interviewerFeeUsd
              - createdAt
              - updatedAt
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
      required:
        - data
        - nextCursor
        - hasMore
    CancelInterview:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - reason
    ScorecardRequest:
      type: object
      properties:
        interviewId:
          type: string
          format: uuid
        recommendation:
          type: string
          enum:
            - STRONG_YES
            - YES
            - WEAK_YES
            - WEAK_NO
            - NO
            - STRONG_NO
        technicalScore:
          type: integer
          minimum: 1
          maximum: 5
        communicationScore:
          type: integer
          minimum: 1
          maximum: 5
        problemSolvingScore:
          type: integer
          minimum: 1
          maximum: 5
        culturalFitScore:
          type: integer
          minimum: 1
          maximum: 5
        freeformFeedback:
          type: string
          minLength: 1
          maxLength: 2000
        redFlags:
          type: string
          maxLength: 1000
        wouldHireAgain:
          type: boolean
      required:
        - interviewId
        - recommendation
        - freeformFeedback
    ScorecardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        interviewId:
          type: string
          format: uuid
        recommendation:
          type: string
          enum:
            - STRONG_YES
            - YES
            - WEAK_YES
            - WEAK_NO
            - NO
            - STRONG_NO
        technicalScore:
          type: integer
          nullable: true
        communicationScore:
          type: integer
          nullable: true
        problemSolvingScore:
          type: integer
          nullable: true
        culturalFitScore:
          type: integer
          nullable: true
        freeformFeedback:
          type: string
        redFlags:
          type: string
          nullable: true
        wouldHireAgain:
          type: boolean
          nullable: true
        submittedAt:
          type: string
          format: date-time
        submittedBy:
          type: string
          format: uuid
      required:
        - id
        - interviewId
        - recommendation
        - technicalScore
        - communicationScore
        - problemSolvingScore
        - culturalFitScore
        - freeformFeedback
        - redFlags
        - wouldHireAgain
        - submittedAt
        - submittedBy
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
        version:
          type: string
      required:
        - status
        - service
        - version
  parameters: {}
paths:
  /api/v1/interviews:
    post:
      tags:
        - Interviews
      summary: Schedule an interview (CUSTOMER only)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInterviewRequest"
      responses:
        "201":
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewResponse"
        "400":
          description: Submission not in schedulable status or invalid time range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — only customers can schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Interviews
      summary: List interviews (visibility-scoped)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: false
          name: requirementId
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: submissionId
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: candidateId
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: interviewerUserId
          in: query
        - schema:
            type: string
            enum:
              - SCHEDULED
              - IN_PROGRESS
              - COMPLETED
              - CANCELLED
              - NO_SHOW
          required: false
          name: status
          in: query
        - schema:
            type: string
          required: false
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/interviews/{id}:
    get:
      tags:
        - Interviews
      summary: Get interview details
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Interview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/interviews/{id}/start:
    post:
      tags:
        - Interviews
      summary: Mark interview as started (participants only)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: In progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/interviews/{id}/end:
    post:
      tags:
        - Interviews
      summary: Mark interview as completed (participants only)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/interviews/{id}/cancel:
    post:
      tags:
        - Interviews
      summary: Cancel a SCHEDULED interview (scheduler or interviewer)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelInterview"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not the scheduler, interviewer, or admin; or interview
            not in SCHEDULED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/scorecards:
    post:
      tags:
        - Scorecards
      summary: Submit a post-interview scorecard (interviewer or scheduler)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScorecardRequest"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorecardResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not the interviewer or scheduler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Scorecard already submitted for this interview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Scorecards
      summary: Get scorecard for an interview (scheduler and interviewer only)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: interviewId
          in: query
      responses:
        "200":
          description: Scorecard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorecardResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — candidates cannot read scorecards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scorecard not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health:
    get:
      tags:
        - System
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
