# Edge reverse proxy. TLS termination + security headers + fan-out to web
# and api-gateway. Backend services are not exposed directly — the browser
# only talks to this nginx.

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Trust nothing by default in terms of client headers we don't explicitly
  # forward. Map the upgrade header for WebSocket support (future-proofing).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Redirect all HTTP to HTTPS.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Cert paths — volume-mounted from ./certs. For Let's Encrypt, symlink or
    # bind-mount /etc/letsencrypt/live/<domain> into ./certs on the host.
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Security headers. CSP kept permissive for Next's inline scripts; tighten
    # when you move fully to strict nonces.
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16m;

    # Web app (Next.js) — everything that isn't /api/*
    location / {
      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_read_timeout 60s;
    }

    # Static Next assets — long cache
    location /_next/static/ {
      proxy_pass http://web:3000;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API gateway (fan-out to all backend services)
    location /api/ {
      proxy_pass         http://api-gateway:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
