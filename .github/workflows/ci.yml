name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check OpenAPI specs are up to date
        run: |
          pnpm --filter @techorbit/identity openapi:generate
          pnpm --filter @techorbit/profile openapi:generate
          pnpm --filter @techorbit/requirement openapi:generate
          pnpm --filter @techorbit/matching openapi:generate
          pnpm --filter @techorbit/interview openapi:generate
          pnpm --filter @techorbit/placement openapi:generate
          pnpm --filter @techorbit/payments openapi:generate
          pnpm --filter @techorbit/messaging openapi:generate
          pnpm --filter @techorbit/notification openapi:generate
          pnpm --filter @techorbit/rating openapi:generate
          pnpm --filter @techorbit/admin openapi:generate
          if [[ -n $(git status --porcelain) ]]; then
            echo "OpenAPI specs are out of sync. Run pnpm openapi:generate in each service and commit."
            git diff
            exit 1
          fi